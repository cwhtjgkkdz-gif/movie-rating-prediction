<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电影类型分类 — 分类任务</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","SimHei",sans-serif;background:#0f1923;color:#e0e0e0;min-height:100vh}
  .nav{background:#1a2735;padding:14px 30px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #2a3a50}
  .nav a{color:#5b9bd5;text-decoration:none;font-size:.95em}
  .container{max-width:900px;margin:0 auto;padding:30px 20px}
  h1{color:#5b9bd5;margin-bottom:6px}
  .sub{opacity:.6;margin-bottom:30px;font-size:.9em}
  .section{background:#1a2735;border-radius:12px;padding:25px;margin-bottom:20px}
  .section h3{color:#5b9bd5;margin-bottom:15px;font-size:1.05em;border-bottom:1px solid #2a3a50;padding-bottom:10px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{margin-bottom:14px}
  .field label{display:block;margin-bottom:5px;font-size:.85em;opacity:.7}
  .field input,.field select{width:100%;padding:9px 12px;background:#0f1923;border:1px solid #2a3a50;border-radius:6px;color:#e0e0e0;font-size:.9em}
  .field input:focus{outline:none;border-color:#5b9bd5}
  .field input[type=range]{padding:0;height:6px;-webkit-appearance:none;background:#2a3a50;border:none;border-radius:3px}
  .field input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:#5b9bd5;border-radius:50%}
  .range-val{text-align:center;color:#5b9bd5;font-weight:bold;font-size:.9em}
  .genres{display:flex;flex-wrap:wrap;gap:6px}
  .genres label{padding:5px 12px;background:#0f1923;border:1px solid #2a3a50;border-radius:20px;font-size:.8em;cursor:pointer;transition:all .2s;user-select:none}
  .genres input{display:none}
  .genres input:checked+span{color:#5b9bd5;font-weight:bold}
  .genres label:has(input:checked){border-color:#5b9bd5;background:#5b9bd515}
  .btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#5b9bd5,#4472c4);color:white;border:none;border-radius:10px;font-size:1.1em;cursor:pointer;font-weight:bold;transition:all .3s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(91,155,213,.3)}
  .preset{padding:8px 16px;background:#1a2735;border:1px solid #2a3a50;border-radius:8px;color:#bbb;cursor:pointer;font-size:.85em;transition:all .2s}
  .preset:hover{border-color:#5b9bd5;color:#5b9bd5;background:#5b9bd510}
  .result{display:none;margin-top:30px}
  .result.show{display:block}
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}
  .r-card{background:#1a2735;border-radius:12px;padding:20px;text-align:center;border:2px solid #2a3a50}
  .r-card.best{border-color:#5b9bd5}
  .r-card .model{font-size:.8em;opacity:.5;margin-bottom:8px}
  .r-card .pred{font-size:1.6em;font-weight:bold;color:#5b9bd5}
  .top3{margin-top:12px;font-size:.85em}
  .top3 .item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #2a3a5020}
  .top3 .item .name{opacity:.7}
  .top3 .item .prob{color:#5b9bd5;font-weight:bold}
</style>
</head>
<body>
<div class="nav">
  <a href="/">🏠 首页</a><span style="color:#3a4a60">›</span>
  <span>🏷️ 类型分类</span>
  <span style="margin-left:auto;opacity:.5;font-size:.85em">决策树 + 随机森林</span>
</div>
<div class="container">
  <h1>🏷️ 电影类型分类</h1>
  <p class="sub">输入电影属性，决策树 + 随机森林判断电影属于哪种类型（17类），展示 Top 3 候选及置信度</p>

  <div class="section">
    <h3>📊 电影统计信息</h3>
    <div class="row">
      <div class="field">
        <label>上映年份: <span id="year-val" class="range-val">__MOVIE_YEAR__</span></label>
        <input type="range" id="movie_year" min="__YEAR_MIN__" max="__YEAR_MAX__" value="__MOVIE_YEAR__" oninput="document.getElementById('year-val').textContent=this.value">
      </div>
      <div class="field">
        <label>平均评分 <span style="opacity:.5">(1-5)</span>: <span id="ar-val" class="range-val">3.5</span></label>
        <input type="range" id="avg_rating" min="1" max="5" step="0.1" value="3.5" oninput="document.getElementById('ar-val').textContent=this.value">
      </div>
      <div class="field"><label>评分人数 <span style="opacity:.5">(热度)</span></label><input type="number" id="num_ratings" value="100" min="1" max="600"></div>
      <div class="field">
        <label>评分标准差 <span style="opacity:.5">(争议度)</span>: <span id="sr-val" class="range-val">1.0</span></label>
        <input type="range" id="std_rating" min="0" max="2" step="0.1" value="1.0" oninput="document.getElementById('sr-val').textContent=this.value">
      </div>
    </div>
  </div>

  <div class="section">
    <h3>🎬 电影类型标志（选 1-3 个，模拟该电影的类型标签）</h3>
    <div class="genres" id="genre-group">__GENRES__</div>
    <p style="opacity:.4;font-size:.8em;margin-top:12px">不选则全靠统计特征判断；选中的类型会显著影响预测结果</p>
  </div>

  <div class="section" style="margin-bottom:15px">
    <h3>⚡ 真实电影案例</h3>
    <div style="display:flex;flex-wrap:wrap;gap:10px">
      <button class="preset" onclick="preset('starwars')">🚀 Star Wars（动作·冒险·科幻）</button>
      <button class="preset" onclick="preset('toystory')">🧸 Toy Story（动画·儿童·喜剧）</button>
      <button class="preset" onclick="preset('titanic')">🚢 Titanic（剧情·爱情）</button>
      <button class="preset" onclick="preset('godfather')">🍷 The Godfather（剧情·犯罪）</button>
      <button class="preset" onclick="preset('shining')">🪓 The Shining（恐怖）</button>
    </div>
  </div>

  <button class="btn" onclick="predict()">🔮 分类预测</button>

  <div class="result" id="result">
    <h3 style="margin-bottom:15px;color:#5b9bd5">预测结果</h3>
    <div class="result-grid">
      <div class="r-card">
        <div class="model">CART 决策树</div>
        <div class="pred" id="dt-class">-</div>
        <div class="top3" id="dt-top3"></div>
      </div>
      <div class="r-card">
        <div class="model">随机森林 (n=200)</div>
        <div class="pred" id="rf-class">-</div>
        <div class="top3" id="rf-top3"></div>
      </div>
    </div>
    <p style="opacity:.4;font-size:.85em;text-align:center">两模型一致 → 高置信度；不一致 → 边界样本</p>
  </div>
</div>

<script>
function setVal(id,val){document.getElementById(id).value=val;if(document.getElementById(id+'-val'))document.getElementById(id+'-val').textContent=val;}
function preset(type){
  document.querySelectorAll('.genre').forEach(cb=>cb.checked=false);
  const cases={
    starwars:{movie_year:1977,avg_rating:'4.0',num_ratings:'583',std_rating:'0.9',genres:['Action','Adventure','Sci-Fi']},
    toystory:{movie_year:1995,avg_rating:'3.9',num_ratings:'452',std_rating:'0.7',genres:['Animation',"Children's",'Comedy']},
    titanic:{movie_year:1997,avg_rating:'4.1',num_ratings:'350',std_rating:'0.8',genres:['Drama','Romance']},
    godfather:{movie_year:1972,avg_rating:'4.5',num_ratings:'200',std_rating:'0.5',genres:['Drama','Crime']},
    shining:{movie_year:1980,avg_rating:'3.8',num_ratings:'150',std_rating:'1.3',genres:['Horror']},
  };
  let c=cases[type];
  Object.keys(c).forEach(k=>{
    if(k==='genres') c[k].forEach(g=>{let cb=document.querySelector(`.genre[data-genre="${g}"]`);if(cb)cb.checked=true;});
    else setVal(k,c[k]);
  });
}
function getFeatures(){
  let data={};
  ['movie_year','avg_rating','num_ratings','std_rating'].forEach(id=>{
    data[id]=document.getElementById(id).value;
  });
  document.querySelectorAll('.genre:checked').forEach(cb=>{data['genre_'+cb.dataset.genre]='1';});
  return data;
}
function top3Html(items){
  return items.map(i=>`<div class="item"><span class="name">${i.class}</span><span class="prob">${i.prob}%</span></div>`).join('');
}
async function predict(){
  let data=getFeatures();
  let resp=await fetch('/api/predict/classification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  let r=await resp.json();
  document.getElementById('dt-class').textContent=r.dt_class;
  document.getElementById('dt-top3').innerHTML=top3Html(r.dt_top3);
  document.getElementById('rf-class').textContent=r.rf_class;
  document.getElementById('rf-top3').innerHTML=top3Html(r.rf_top3);
  document.getElementById('result').classList.add('show');
  document.querySelectorAll('.r-card').forEach(c=>c.classList.remove('best'));
  document.getElementById('rf-card')?.classList.add('best');
  if(r.dt_class===r.rf_class){
    document.querySelectorAll('.r-card').forEach(c=>c.classList.add('best'));
  }
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
